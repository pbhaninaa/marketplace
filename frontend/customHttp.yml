# AWS Amplify custom headers — mirrors frontend/vercel.json. Keep the two in sync.
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self)
  - pattern: "/assets/**/*"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: no-cache
