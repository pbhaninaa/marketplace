# AWS (App Runner / Elastic Beanstalk / ECS) — set SPRING_PROFILES_ACTIVE=aws.
# The "aws" profile group (application.properties) also activates "prod", so every variable
# required by application-prod.properties applies and DeployedProfileValidator runs
# (see ENV.md and docs/aws/DEPLOY.md):
#   SPRING_DATASOURCE_URL (jdbc:mysql://<rds-endpoint>:3306/marketplace?useSSL=true&serverTimezone=UTC),
#   SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, APP_JWT_SECRET (32+ chars),
#   PROD_CORS_ORIGINS, PUBLIC_APP_BASE_URL, SENDGRID_API_KEY, EMAIL_DOMAIN (or EMAIL_FROM).
# Port: prod binds ${PORT:8080}; App Runner / EB / ECS route to container port 8080.
# Health check path: /actuator/health (process-only liveness: /actuator/health/liveness).
# Note: spring.profiles.include is not allowed in profile-specific files, hence the group.

# Let the load balancer drain in-flight requests on deploys / scale-in.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
