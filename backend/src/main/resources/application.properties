spring.application.name=agrimarketplace
# Local dev: run with -Dspring.profiles.active=local (see application-local.properties).
# Deployed hosts MUST set SPRING_PROFILES_ACTIVE=uat or prod (or aws / azure, see below).

# Cloud profiles: SPRING_PROFILES_ACTIVE=aws or azure also activates prod (same required env and
# DeployedProfileValidator checks). Cloud-specific extras live in application-aws/azure.properties.
spring.profiles.group.aws=prod
spring.profiles.group.azure=prod

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.env=LOCAL
# CORS: do NOT set indexed app.cors.allowed-origins[n] here — it overrides UAT/PROD
# scalar PROD_CORS_ORIGINS / UAT_CORS_ORIGINS. Profiles set the list (comma-separated).
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.cart.session-ttl-hours=72
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.payments.provider=stub
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.sendgrid-api-key=${SENDGRID_API_KEY:}
app.email.from=${EMAIL_FROM:}
app.email.domain=${EMAIL_DOMAIN:}
app.email.public-app-base-url=${PUBLIC_APP_BASE_URL:http://localhost:5173}

# Login / sign-up / password reset / OTP abuse protection
# (security/AuthRateLimitFilter, LoginAttemptService, PasswordPolicy; config/AuthSecurityProperties).
# Per-IP limits on public auth endpoints (429 + Retry-After). Must stay on for UAT/PROD.
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
app.security.rate-limit.login-per-hour=${RATE_LIMIT_LOGIN_PER_HOUR:100}
app.security.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:10}
app.security.rate-limit.forgot-password-per15-min=${RATE_LIMIT_FORGOT_PASSWORD_PER_15_MIN:5}
app.security.rate-limit.reset-password-per15-min=${RATE_LIMIT_RESET_PASSWORD_PER_15_MIN:10}
app.security.rate-limit.otp-request-per15-min=${RATE_LIMIT_OTP_REQUEST_PER_15_MIN:5}
app.security.rate-limit.otp-verify-per15-min=${RATE_LIMIT_OTP_VERIFY_PER_15_MIN:20}
app.security.rate-limit.change-password-per15-min=${RATE_LIMIT_CHANGE_PASSWORD_PER_15_MIN:10}
# Per email address caps on security emails (over the cap: same response, nothing sent).
app.security.per-email.forgot-password-per-hour=${FORGOT_PASSWORD_EMAILS_PER_HOUR:3}
app.security.per-email.otp-sends-per15-min=${OTP_SENDS_PER_15_MIN:3}
# Proxies in front of the API that append to X-Forwarded-For. Railway only = 1 (browsers call the
# Railway API directly; Vercel only serves the frontend); load balancer + nginx = 2; nothing = 0.
app.security.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}
# Lock an account for lock-minutes after max-failures wrong passwords in a row (a password reset unlocks).
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
# Provider sign-up must confirm the owner email with an emailed code before the server reveals
# whether the email is already registered. Needs email sending on UAT/PROD.
app.signup.require-email-verification=${SIGNUP_REQUIRE_EMAIL_VERIFICATION:true}
# SIT/local only: return the sign-up code to the form instead of emailing it. Must stay false on UAT/PROD.
app.signup.expose-test-code=${SIGNUP_EXPOSE_TEST_CODE:false}

# SMS (Twilio) — optional; no-op when disabled
app.sms.enabled=${APP_SMS_ENABLED:false}
app.sms.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.from-number=${TWILIO_FROM_NUMBER:}
app.sms.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
app.sms.default-country-code=${APP_PHONE_COUNTRY_CODE:+27}

# Peach Payments Hosted Checkout V2 — single platform merchant account (optional; disabled by
# default). Providers opt in to accepting PEACH as a client payment method once configured.
# Client methods are CASH or PEACH; Peach then offers the forced CARD or PAYBYBANK (Instant EFT)
# method selected by the client. The same Peach flow activates provider subscriptions.
peach.enabled=${PEACH_ENABLED:false}
peach.sandbox=${PEACH_SANDBOX:true}
peach.client-id=${PEACH_CLIENT_ID:}
peach.client-secret=${PEACH_CLIENT_SECRET:}
peach.merchant-id=${PEACH_MERCHANT_ID:}
peach.entity-id=${PEACH_ENTITY_ID:}
peach.secret-token=${PEACH_SECRET_TOKEN:}

# PayFast hosted checkout: single platform merchant account (optional; disabled by default).
# Serves the same online "Card / Instant EFT" option as Peach; Admin Settings picks the gateway
# (AUTO = PayFast when configured, else Peach). PAYFAST_PUBLIC_BASE_URL is this backend's public
# https URL, used for notify_url (ITN): {base}/api/public/payfast/notify.
payfast.enabled=${PAYFAST_ENABLED:false}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.merchant-id=${PAYFAST_MERCHANT_ID:}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:}
payfast.passphrase=${PAYFAST_PASSPHRASE:}
payfast.public-base-url=${PAYFAST_PUBLIC_BASE_URL:}
payfast.validate-with-server=${PAYFAST_VALIDATE_WITH_SERVER:true}

# Release orders/rentals that were never paid (stock and rental dates are freed). 0 turns a rule off.
app.orders.unpaid-expiry.enabled=${UNPAID_EXPIRY_ENABLED:true}
app.orders.unpaid-expiry.card-minutes=${UNPAID_EXPIRY_CARD_MINUTES:60}
app.orders.unpaid-expiry.eft-hours=${UNPAID_EXPIRY_EFT_HOURS:72}
app.orders.unpaid-expiry.cash-days=${UNPAID_EXPIRY_CASH_DAYS:14}

# Delivery is priced from the seller pickup pin to the buyer pin: straight line x road factor.
app.delivery.road-factor=${DELIVERY_ROAD_FACTOR:1.3}
app.delivery.max-km=${DELIVERY_MAX_KM:1000}
