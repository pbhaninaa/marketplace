# System integration test (in-memory H2)
spring.datasource.url=jdbc:h2:mem:agrimarket_sit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sit
spring.datasource.password=sit

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.env=SIT
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.jwt.secret=sit-jwt-secret-key-at-least-32-characters-long!!
app.payments.provider=stub
app.seed-demo-data=true

# Bank details (optional in SIT)
app.bank.bank-name=Test Bank
app.bank.account-name=Agri Marketplace
app.bank.account-number=0000000000
app.bank.branch-code=
app.bank.reference-hint=Use your Provider Name as reference

# Subscription pricing (monthly)
app.subscription.pricing.basic-monthly=199
app.subscription.pricing.premium-monthly=499

logging.level.com.agrimarket=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Sign-up email codes are fake here: the code is returned to the form and filled in (no email sent).
app.signup.expose-test-code=true

# PayFast: on by default here, in sandbox mode, with PayFast's PUBLISHED PUBLIC SANDBOX test merchant
# (merchant 10000100 / key 46f0cd694581a / passphrase jt7NOE43FZPn). These are PayFast's public test
# credentials, not secrets; override with the PAYFAST_* env vars. Set PAYFAST_PUBLIC_BASE_URL to the
# backend's public https URL (or a tunnel) so PayFast can deliver the ITN; on localhost it never arrives
# and the return page keeps showing "waiting for confirmation".
payfast.enabled=${PAYFAST_ENABLED:true}
payfast.sandbox=true
payfast.merchant-id=${PAYFAST_MERCHANT_ID:10000100}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:46f0cd694581a}
payfast.passphrase=${PAYFAST_PASSPHRASE:jt7NOE43FZPn}
payfast.public-base-url=${PAYFAST_PUBLIC_BASE_URL:http://localhost:8080}
