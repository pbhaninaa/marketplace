# MarketPlace API -> AWS Elastic Beanstalk (Docker on Amazon Linux 2023) with a pre-built JAR.
# The JAR is built (and tested) here, so small EB instances only run a tiny runtime image
# instead of a full Maven build that can time out.
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
#          EB_APPLICATION_NAME, EB_ENVIRONMENT_NAME, EB_S3_BUCKET
# On push, runs only when repo variable AWS_API_TARGET is "elasticbeanstalk"; always on manual dispatch.
name: AWS API — Elastic Beanstalk

on:
  push:
    branches: [AWS]
    paths:
      - "backend/**"
      - "scripts/aws/**"
      - ".github/workflows/aws-api-elastic-beanstalk.yml"
  workflow_dispatch:

concurrency:
  group: aws-api-elastic-beanstalk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AWS_API_TARGET == 'elasticbeanstalk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs the full test suite before producing the JAR (no -DskipTests).
      - name: Test and package
        run: bash scripts/aws/package-eb-docker.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle and deploy
        working-directory: backend
        env:
          EB_APP: ${{ secrets.EB_APPLICATION_NAME }}
          EB_ENV: ${{ secrets.EB_ENVIRONMENT_NAME }}
          EB_BUCKET: ${{ secrets.EB_S3_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          for v in EB_APP EB_ENV EB_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          VERSION_LABEL="marketplace-${SHA:0:8}-$(date +%s)"
          KEY="marketplace-api/$VERSION_LABEL.zip"
          aws s3 cp eb-docker-deploy.zip "s3://$EB_BUCKET/$KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$EB_BUCKET",S3Key="$KEY"
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APP" \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION_LABEL"
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APP" \
            --environment-names "$EB_ENV"
