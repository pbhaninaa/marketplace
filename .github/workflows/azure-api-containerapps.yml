# MarketPlace API container -> Azure Container Apps (image built from backend/Dockerfile, pushed to ACR).
# Secrets: AZURE_CREDENTIALS, ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD,
#          AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP_NAME
# On push, runs only when repo variable AZURE_API_TARGET is "containerapps"; always on manual dispatch.
name: Azure API — Container Apps

on:
  push:
    branches: [Azure]
    paths:
      - "backend/**"
      - ".github/workflows/azure-api-containerapps.yml"
  workflow_dispatch:

concurrency:
  group: azure-api-containerapps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    if: github.event_name == 'workflow_dispatch' || vars.AZURE_API_TARGET == 'containerapps'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  build-and-deploy:
    name: Build image and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        working-directory: backend
        env:
          REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/marketplace-api:$SHA"
          docker build -t "$IMAGE" -t "$REGISTRY/marketplace-api:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/marketplace-api:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Container App
        env:
          APP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
